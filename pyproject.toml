[project]
name = "gitgoblin"
version = "2.0.0"
description = "Agentic AI GitHub App for pull request reviews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "openai>=1.60",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitgoblin"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.alembic]
script_location = "%(here)s/gitgoblin/db/migrations"
# Put the repo root on sys.path so env.py can `import gitgoblin` even when the
# editable install isn't picked up (e.g. macOS hides .venv files on iCloud Desktop).
prepend_sys_path = ["."]
# Date-prefixed files sort in the order they were written.
file_template = "%%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every `async def test_*` runs on its own event loop without a decorator.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
