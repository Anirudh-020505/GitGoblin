[project]
name = "gitgoblin"
version = "2.0.0"
description = "Agentic AI GitHub App for pull request reviews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "openai>=1.60",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitgoblin"]
