services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gitgoblin
      POSTGRES_PASSWORD: gitgoblin
      POSTGRES_DB: gitgoblin
    # 5433 on your Mac -> 5432 in the container (5432 is taken by a native Postgres).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitgoblin -d gitgoblin"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
